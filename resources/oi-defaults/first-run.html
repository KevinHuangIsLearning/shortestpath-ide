<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
	<title>ShortestPath IDE</title>
	<style>
		:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, #25345f 0, transparent 38%), #0f1117; color: #f4f6fb; }
		main { width: min(960px, calc(100vw - 80px)); }
		.badge { color: #a8c7ff; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
		h1 { font-size: clamp(42px, 6vw, 72px); margin: 14px 0; letter-spacing: -.04em; }
		.lead { font-size: 20px; line-height: 1.6; color: #b7bfce; max-width: 680px; }
		button { appearance: none; font: inherit; color: inherit; cursor: pointer; }
		.options { display: none; padding: 22px 0 8px; color: #d9e2f2; }
		.options.visible { display: grid; gap: 14px; }
		.source-choice { margin-top: 8px; color: #d9e2f2; }
		select { margin-left: 10px; padding: 8px 10px; border: 1px solid #30394d; border-radius: 8px; background: #171b25; color: #f4f6fb; font: inherit; }
		label { display: flex; gap: 12px; align-items: center; font-size: 16px; }
		input[type="checkbox"] { width: 18px; height: 18px; accent-color: #78a9ff; }
		input[type="number"] { width: 86px; padding: 8px 10px; border: 1px solid #30394d; border-radius: 8px; background: #171b25; color: #f4f6fb; font: inherit; }
		input[type="text"] { flex: 1; min-width: 260px; padding: 8px 10px; border: 1px solid #30394d; border-radius: 8px; background: #171b25; color: #f4f6fb; font: inherit; }
		#workspaceFolder-pick { padding: 8px 12px; border: 1px solid #4d638b; border-radius: 8px; background: #253b64; color: #e8f0ff; font-weight: 600; }
		#workspaceFolder-pick:hover { background: #304d80; }
		.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; }
		.primary { padding: 13px 24px; border: 0; border-radius: 9px; background: #78a9ff; color: #071329; font-weight: 700; }
		.skip { border: 0; background: transparent; color: #aeb8c9; }
		.note { color: #8d98aa; font-size: 14px; }
		[hidden] { display: none !important; }
		.progress-panel { margin-top: 34px; }
		.progress-track { height: 10px; overflow: hidden; border-radius: 999px; background: #252d3d; box-shadow: inset 0 1px 2px #070a10; }
		.progress-bar { width: 38%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #78a9ff, #a8c7ff); animation: progress-indeterminate 1.5s ease-in-out infinite; }
		.progress-panel.determinate .progress-bar { width: var(--progress); animation: none; }
		.progress-panel.complete .progress-bar { width: 100%; animation: none; }
		.progress-panel.error .progress-bar { width: 100%; animation: none; background: #f48771; }
		.progress-description { min-height: 1.6em; margin: 14px 0 0; color: #b7c8e8; font-size: 14px; line-height: 1.6; }
		.status { color: #a8c7ff; font-size: 18px; }
		.drag-region { position: fixed; inset: 0 0 auto; height: 32px; -webkit-app-region: drag; }
		@keyframes progress-indeterminate { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
	</style>
</head>
<body>
	<div class="drag-region" aria-hidden="true"></div>
	<main>
		<section id="choice-page">
		<div class="badge">ShortestPath IDE</div>
		<h1 id="choice-title">准备好开始竞赛编程。</h1>
		<p id="choice-lead" class="lead">我们会准备编译环境，并选择 C++ 语言版本，然后打开工作台。</p>
		<div id="source-choice" class="source-choice" hidden><label><span id="source-label">下载源</span><select id="download-source"></select></label></div>
		<div class="actions">
			<button id="skip" class="skip">稍后配置</button>
			<div><span id="permission-note" class="note">安装需要确认，可能要求管理员权限。</span> <button id="continue" class="primary">继续</button></div>
		</div>
		</section>
		<section id="download-page" hidden>
			<div class="badge">Toolchain</div>
			<h1 id="download-title">正在准备编译环境。</h1>
			<p id="download-status" class="status">正在连接下载源…</p>
			<div id="progress" class="progress-panel" role="progressbar" aria-label="安装进度" aria-valuetext="正在准备">
				<div class="progress-track"><div class="progress-bar"></div></div>
				<p id="progress-description" class="progress-description" aria-live="polite">正在准备编译环境…</p>
			</div>
			<div class="actions"><span id="download-note" class="note">请保持此窗口打开。准备完成后可继续配置。</span><span><button id="retry" class="primary" hidden>重试</button><button id="download-next" class="primary" hidden>下一步</button></span></div>
		</section>
		<section id="configure-page" hidden>
			<div class="badge">Configuration</div>
			<h1 id="configuration-title">工具链已准备就绪。</h1>
			<p id="configuration-lead" class="lead">确认要写入的 ShortestPath IDE 配置，然后进入工作台。</p>
			<div id="final-options" class="options visible"></div>
			<div class="actions"><span id="configuration-note" class="note">设置写入个人配置，不影响其他编辑器。</span><button id="finish" class="primary">下一步</button></div>
		</section>
		<section id="workspace-page" hidden>
			<div class="badge">Workspace</div>
			<h1 id="workspace-title">选择工作目录。</h1>
			<p id="workspace-lead" class="lead">我们会在此目录创建 .clangd，并在完成后直接打开它。</p>
			<div class="options visible"><label><span id="workspace-label">工作目录</span><input id="workspaceFolder" type="text" readonly><button id="workspaceFolder-pick" type="button">选择目录</button></label></div>
			<div class="actions"><span id="workspace-note" class="note">已有 .clangd 不会被覆盖。</span><button id="workspace-finish" class="primary">应用配置并打开工作目录</button></div>
		</section>
	</main>
	<script>
	(async () => {
		const locale = await window.shortestPathSetup.getLocale();
		const language = typeof locale === 'string' && locale.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
		const script = await window.shortestPathSetup.getScript();
		const localize = value => typeof value === 'string' ? value : value[language] ?? value.en ?? value['zh-CN'];
		const pages = script.pages;
		const sources = Array.isArray(script.downloadSources) ? script.downloadSources : [];
		const translations = {
			'en': {
				choiceTitle: 'Ready for competitive programming.', choiceLead: 'We will prepare the compiler environment and choose the C++ language version before opening the IDE.',
				permission: 'Preparation may require confirmation or administrator permission.', skip: 'Configure later', continue: 'Continue', downloadTitle: 'Preparing your build environment.', downloadNote: 'Keep this window open. You can continue when preparation finishes.', retry: 'Retry', next: 'Next', progressLabel: 'Installation progress', configurationTitle: 'Your toolchain is ready.', configurationLead: 'Confirm the ShortestPath IDE preferences to save before opening the workbench.', configurationNote: 'Settings are saved to your user profile and do not affect other editors.', workspaceTitle: 'Choose your workspace folder.', workspaceLead: 'We will create .clangd in this folder and open it when setup is complete.', workspaceLabel: 'Workspace folder', chooseFolder: 'Choose folder', workspaceNote: 'Existing .clangd files will not be overwritten.', applyAndOpen: 'Apply Settings and Open Workspace', selectWorkspace: 'Select a workspace folder.', preparing: 'Preparing the build environment…', completed: 'Build environment ready. Select Next to continue configuration.', alreadyInstalled: 'Build environment is already ready. Preparation skipped.', failed: 'Build environment preparation failed: {message}'
			},
			'zh-CN': {
				choiceTitle: '准备好开始竞赛编程。', choiceLead: '我们会准备编译环境，并选择 C++ 语言版本，然后打开工作台。',
				permission: '准备环境需要确认，可能要求管理员权限。', skip: '稍后配置', continue: '继续', downloadTitle: '正在准备编译环境。', downloadNote: '请保持此窗口打开。准备完成后可继续配置。', retry: '重试', next: '下一步', progressLabel: '安装进度', configurationTitle: '工具链已准备就绪。', configurationLead: '确认要写入的 ShortestPath IDE 配置，然后进入工作台。', configurationNote: '设置写入个人配置，不影响其他编辑器。', workspaceTitle: '选择工作目录。', workspaceLead: '我们会在此目录创建 .clangd，并在完成后直接打开它。', workspaceLabel: '工作目录', chooseFolder: '选择目录', workspaceNote: '已有 .clangd 不会被覆盖。', applyAndOpen: '应用配置并打开工作目录', selectWorkspace: '请选择工作目录。', preparing: '正在准备编译环境…', completed: '编译环境已准备就绪。点击“下一步”继续配置。', alreadyInstalled: '编译环境已就绪，已跳过重复准备。', failed: '编译环境准备失败：{message}'
			}
		};
		const t = translations[language];
		document.documentElement.lang = language;
		document.getElementById('choice-title').textContent = t.choiceTitle;
		document.getElementById('choice-lead').textContent = t.choiceLead;
		document.getElementById('permission-note').textContent = t.permission;
		document.getElementById('skip').textContent = t.skip;
		document.getElementById('continue').textContent = t.continue;
		document.getElementById('download-title').textContent = t.downloadTitle;
		document.getElementById('download-note').textContent = t.downloadNote;
		document.getElementById('retry').textContent = t.retry;
		document.getElementById('download-next').textContent = t.next;
		document.getElementById('progress').setAttribute('aria-label', t.progressLabel);
		document.getElementById('configuration-title').textContent = t.configurationTitle;
		document.getElementById('configuration-lead').textContent = t.configurationLead;
		document.getElementById('configuration-note').textContent = t.configurationNote;
		document.getElementById('finish').textContent = t.next;
		document.getElementById('workspace-title').textContent = t.workspaceTitle;
		document.getElementById('workspace-lead').textContent = t.workspaceLead;
		document.getElementById('workspace-label').textContent = t.workspaceLabel;
		document.getElementById('workspaceFolder-pick').textContent = t.chooseFolder;
		document.getElementById('workspace-note').textContent = t.workspaceNote;
		document.getElementById('workspace-finish').textContent = t.applyAndOpen;
		document.getElementById('choice-title').textContent = localize(pages[0].title);
		document.getElementById('choice-lead').textContent = localize(pages[0].text);
		const pageById = id => pages.find(page => page.id === id);
		const toolchainPage = pageById('toolchain') ?? pages.find(page => page.controls === undefined && page !== pages[0]);
		const xcodePage = pageById('xcode');
		const homebrewPage = pageById('homebrew');
		const configurationPage = pageById('configuration') ?? pages.find(page => Array.isArray(page.controls));
		document.getElementById('download-title').textContent = localize(toolchainPage.title);
		document.getElementById('download-status').textContent = localize(toolchainPage.text);
		document.getElementById('configuration-title').textContent = localize(configurationPage.title);
		document.getElementById('configuration-lead').textContent = localize(configurationPage.text);
		const sourceChoice = document.getElementById('source-choice');
		const sourceSelect = document.getElementById('download-source');
		if (sources.length) {
			document.getElementById('source-label').textContent = localize(script.downloadSourceLabel);
			sourceSelect.innerHTML = sources.map(source => `<option value="${source.id}" ${source.unavailable ? 'disabled' : ''}>${localize(source.label)}</option>`).join('');
			const chineseSource = sources.find(source => source.id === 'tuna');
			if (language === 'zh-CN' && chineseSource) sourceSelect.value = chineseSource.id;
			sourceChoice.hidden = false;
		}
		let toolchainReady = false;
		const choicePage = document.getElementById('choice-page');
		const downloadPage = document.getElementById('download-page');
		const configurePage = document.getElementById('configure-page');
		const workspacePage = document.getElementById('workspace-page');
		const progress = document.getElementById('progress');
		const progressDescription = document.getElementById('progress-description');
		const status = document.getElementById('download-status');
		const localizeProgress = message => language === 'en' ? message : message
			.replace(/^Preparing (.+)…$/, '正在准备 $1…')
			.replace(/^Downloading (.+)… (.+)$/, '正在下载 $1… $2')
			.replace(/^Extracting (.+)… (.+)$/, '正在解压 $1… $2')
			.replace(/^Installing bundled (.+)…$/, '正在安装内置 $1…')
			.replace(/^Connecting to download source for (.+)…$/, '正在连接 $1 的下载源…')
			.replace(/^Mirror unavailable for (.+); retrying with the official source…$/, '$1 镜像不可用，正在重试官方源…')
			.replace(/^(.+) is already installed; skipping extraction\.$/, '$1 已安装，跳过解压。')
			.replace(/^Portable toolchain installation complete\.$/, '便携工具链安装完成。')
			.replace(/^Toolchain download completed\.$/, '编译环境下载完成。')
			.replace(/^Toolchain installer exited with code (.+)\.$/, '编译环境安装程序以代码 $1 退出。')
			.replace(/^Unable to load (.+) installer: (.+)$/, '无法加载 $1 安装程序：$2')
			.replace(/^Download failed with HTTP (.+)\.$/, '下载失败，HTTP 状态码：$1。')
			.replace(/^Download connection timed out\.$/, '下载连接超时。')
			.replace(/^Download stalled while waiting for data\.$/, '下载等待数据时超时。')
			.replace(/^Download stalled while receiving data\.$/, '下载接收数据时超时。');
		const setProgressDescription = message => {
			message = localizeProgress(message);
			progressDescription.textContent = message;
			progress.setAttribute('aria-valuetext', message);
			const percent = /(?:^|\\s)(\\d{1,3})%/.exec(message)?.[1];
			if (percent !== undefined) {
				progress.classList.add('determinate');
				progress.style.setProperty('--progress', `${Math.min(100, Number(percent))}%`);
			}
		};
		const request = () => ({
			mode: 'recommended',
			installToolchain: true,
			cppStandard: document.getElementById('cppStandard')?.value ?? 'c++23',
			workspaceFolder: document.getElementById('workspaceFolder')?.value ?? ''
		});
		const showConfiguration = () => {
			choicePage.hidden = true;
			downloadPage.hidden = true;
			configurePage.hidden = false;
			const target = document.getElementById('final-options');
			const controls = configurationPage.controls.filter(control => !['installToolchain', 'workspaceFolder'].includes(control.key));
			target.innerHTML = controls.map(control => control.type === 'number'
				? `<label>${localize(control.label)} <input id="${control.key}" type="number" min="${control.min}" max="${control.max}" value="${control.default}"></label>`
				: control.type === 'select'
					? `<label>${localize(control.label)} <select id="${control.key}">${control.options.map(option => `<option value="${option.value}" ${option.value === control.default ? 'selected' : ''}>${localize(option.label)}</option>`).join('')}</select></label>`
					: control.type === 'folder'
						? `<label>${localize(control.label)} <input id="${control.key}" type="text" readonly placeholder="${localize(control.placeholder)}"><button id="${control.key}-pick" type="button">${localize(control.buttonLabel)}</button></label>`
					: `<label><input id="${control.key}" type="checkbox" ${control.default ? 'checked' : ''}>${localize(control.label)}</label>`).join('');
		};
		const showWorkspace = () => {
			configurePage.hidden = true;
			workspacePage.hidden = false;
		};
		document.getElementById('workspaceFolder-pick').addEventListener('click', async () => {
			const folder = await window.shortestPathSetup.pickWorkspaceFolder();
			if (folder) document.getElementById('workspaceFolder').value = folder;
		});
		let downloadStage = 'toolchain';
		const download = async (stage = 'toolchain') => {
			downloadStage = stage;
			const page = stage === 'xcode' ? xcodePage : stage === 'homebrew' ? homebrewPage : toolchainPage;
			choicePage.hidden = true;
			downloadPage.hidden = false;
			progress.className = 'progress-panel';
			progress.style.removeProperty('--progress');
			setProgressDescription(t.preparing);
			document.getElementById('download-title').textContent = localize(page.title);
			status.textContent = localize(page.text);
			document.getElementById('retry').hidden = true;
			document.getElementById('download-next').hidden = true;
			const result = await window.shortestPathSetup.installToolchain(sourceSelect.value || undefined, stage);
			if (result.success) {
				toolchainReady = true;
				progress.classList.add('complete');
				const completionMessage = result.message === 'Toolchain is already installed.' ? t.alreadyInstalled : t.completed;
				status.textContent = completionMessage;
				setProgressDescription(completionMessage);
				document.getElementById('download-next').hidden = false;
			} else {
				progress.classList.add('error');
				status.textContent = t.failed.replace('{message}', localizeProgress(result.message));
				setProgressDescription(status.textContent);
				document.getElementById('retry').hidden = false;
			}
		};
		window.shortestPathSetup.onProgress(message => setProgressDescription(message));
		document.getElementById('continue').addEventListener('click', () => download(xcodePage ? 'xcode' : homebrewPage ? 'homebrew' : 'toolchain'));
		document.getElementById('retry').addEventListener('click', () => download(downloadStage));
		document.getElementById('download-next').addEventListener('click', () => {
			if (downloadStage === 'xcode') {
				download('homebrew');
			} else if (downloadStage === 'homebrew') {
				download('toolchain');
			} else {
				showConfiguration();
			}
		});
		document.getElementById('finish').addEventListener('click', showWorkspace);
		document.getElementById('workspace-finish').addEventListener('click', () => {
			const selectedRequest = request();
			if (!selectedRequest.workspaceFolder) {
				window.alert(t.selectWorkspace);
				return;
			}
			window.shortestPathSetup.complete({ ...selectedRequest, installToolchain: toolchainReady });
		});
		document.getElementById('skip').addEventListener('click', () => window.shortestPathSetup.complete(undefined));
	})();
	</script>
</body>
</html>

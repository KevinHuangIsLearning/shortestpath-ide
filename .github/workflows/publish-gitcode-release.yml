name: Publish GitCode Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag (Release-v* or Beta-v*)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-gitcode-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitCode Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITCODE_OWNER: KevinHuangIsLearning
      GITCODE_REPOSITORY: shortestpath-ide
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            Release-v*|Beta-v*) ;;
            *)
              echo 'tag must start with Release-v or Beta-v.' >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name > gitcode-release-title.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > gitcode-release-notes.md

      - name: Write checksums
        run: |
          cd release
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 -r sha256sum -- > SHA256SUMS

      - name: Publish GitCode Release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/publish-gitcode-release.mjs \
            --tag "$RELEASE_TAG" \
            --title-file gitcode-release-title.txt \
            --notes-file gitcode-release-notes.md \
            --asset-directory release
